name: bancs d'essai
on: [push, pull_request]
permissions:
  contents: read
jobs:
  essais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # le serveur : fichiers servis, Host, méthodes refusées, ligne de commande
      - name: Serveur (Rust)
        run: cargo test -p space
      # l'ancien serveur Python, retiré à l'envoi suivant
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Serveur Python — fichiers servis, Host
        run: python test/banc-serveur.py
      - name: Appairage Python — code, jeton et cookie partagés
        run: python appairage.py
